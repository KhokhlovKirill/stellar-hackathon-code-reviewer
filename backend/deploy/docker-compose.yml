name: aegis

x-app: &app
  build:
    context: ../..
    dockerfile: backend/deploy/Dockerfile
  env_file: ../../.env
  environment:
    AEGIS_DATABASE_URL: postgresql+asyncpg://aegis:aegis@postgres:5432/aegis
    AEGIS_REDIS_URL: redis://redis:6379/0
    AEGIS_FRONTEND_TEMPLATES: /app/frontend/templates
    # Override so containers reach LM Studio on the Mac host
    LMSTUDIO_BASE_URL: http://host.docker.internal:1234/v1
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  # Reach LM Studio running on the host (Apple Silicon / Linux host-gateway).
  # The smtp.mail.ru alias points the container at the host's SMTP egress relay
  # (socat TCP4 -> smtp.mail.ru:465 over IPv6), needed because the hosting
  # provider blocks outbound SMTP/IPv6 from docker bridges. Keeping the hostname
  # as smtp.mail.ru preserves TLS SNI/certificate validation.
  # host.docker.internal → host (LM Studio reverse tunnel, dev parity).
  # smtp.mail.ru is pinned to the *aegis_default* bridge gateway (172.18.0.1),
  # NOT docker's `host-gateway` (which is the docker0 bridge, 172.17.0.1):
  # the api/worker containers live on aegis_default, and cross-bridge return
  # traffic from a docker0-bound relay is dropped by the iptables FORWARD
  # DROP policy. The host-side socat SMTP egress relay therefore binds
  # 172.18.0.1:465 so request+response stay on the same bridge.
  extra_hosts:
    - "host.docker.internal:host-gateway"
    - "smtp.mail.ru:172.18.0.1"
  restart: unless-stopped

services:
  api:
    <<: *app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn aegis.api.app:app --host 0.0.0.0 --port 8080"
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    command: ["arq", "aegis.worker.main.WorkerSettings"]

  web:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:18099:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    volumes: ["aegis_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose: ["5432"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["aegis_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose: ["6379"]

  prometheus:
    image: prom/prometheus:latest
    profiles: ["obs"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/aegis-overview.json
    volumes:
      - "./grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./grafana/dashboards:/var/lib/grafana/dashboards:ro"
    ports: ["3000:3000"]
    depends_on: ["prometheus"]

volumes:
  aegis_pg:
  aegis_redis:

# Pin the default bridge so the gateway IP is deterministic (172.18.0.1).
# The SMTP egress relay and the `smtp.mail.ru` extra_hosts entry depend on
# this address being stable across `docker compose up` cycles.
networks:
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
