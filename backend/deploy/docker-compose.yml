name: aegis

x-app: &app
  build:
    context: ../..
    dockerfile: backend/deploy/Dockerfile
  env_file: ../../.env
  environment:
    AEGIS_DATABASE_URL: postgresql+asyncpg://aegis:aegis@postgres:5432/aegis
    AEGIS_REDIS_URL: redis://redis:6379/0
    AEGIS_FRONTEND_TEMPLATES: /app/frontend/templates
    # Override so containers reach LM Studio on the Mac host
    LMSTUDIO_BASE_URL: http://host.docker.internal:1234/v1
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  # Reach LM Studio running on the host (Apple Silicon / Linux host-gateway).
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  api:
    <<: *app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn aegis.api.app:app --host 0.0.0.0 --port 8080"
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    command: ["arq", "aegis.worker.main.WorkerSettings"]

  web:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:18099:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    volumes: ["aegis_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose: ["5432"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["aegis_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose: ["6379"]

  prometheus:
    image: prom/prometheus:latest
    profiles: ["obs"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/aegis-overview.json
    volumes:
      - "./grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./grafana/dashboards:/var/lib/grafana/dashboards:ro"
    ports: ["3000:3000"]
    depends_on: ["prometheus"]

volumes:
  aegis_pg:
  aegis_redis:
