{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm mt-12">
  <h1 class="text-2xl font-semibold mb-1">Create your account</h1>
  <p class="text-sm text-slate-500 mb-6">Start reviewing pull requests.</p>

  {% if error %}
  <div class="mb-4 rounded border border-red-200 bg-red-50 px-3 py-2
              text-sm text-red-700">{{ error }}</div>
  {% endif %}

  <form method="post" action="/register" class="space-y-4 bg-white p-6
        rounded-lg border border-slate-200 shadow-sm">
    <div>
      <label class="block text-sm font-medium mb-1">Name</label>
      <input name="display_name" type="text"
             class="w-full rounded border border-slate-300 px-3 py-2
                    focus:outline-none focus:ring-2 focus:ring-slate-900">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Email</label>
      <input name="email" type="email" required autofocus
             class="w-full rounded border border-slate-300 px-3 py-2
                    focus:outline-none focus:ring-2 focus:ring-slate-900">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Password</label>
      <input name="password" type="password" required minlength="8"
             class="w-full rounded border border-slate-300 px-3 py-2
                    focus:outline-none focus:ring-2 focus:ring-slate-900">
      <p class="text-xs text-slate-400 mt-1">At least 8 characters.</p>
    </div>
    <button type="submit"
            class="w-full rounded bg-slate-900 text-white py-2
                   font-medium hover:bg-slate-800">Create account</button>
  </form>

  <p class="text-sm text-slate-500 mt-4 text-center">
    Already have an account?
    <a href="/login" class="text-slate-900 font-medium hover:underline">
      Sign in</a>
  </p>
</div>
{% endblock %}
