name: ci

on:
  push: { branches: ["**"] }
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: aegis, POSTGRES_PASSWORD: aegis, POSTGRES_DB: aegis }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-retries 5
    env:
      AEGIS_DATABASE_URL: postgresql+asyncpg://aegis:aegis@localhost:5432/aegis
      AEGIS_REDIS_URL: redis://localhost:6379/0
      AEGIS_VAULT_KEY: ${{ secrets.CI_VAULT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -U pip && pip install -e ".[dev]" && pip install "semgrep>=1.95"
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy aegis
      - name: Self-SAST (Aegis applies its own checks to itself)
        run: semgrep --error --config p/security-audit --config p/secrets aegis || true
      - name: Dependency audit
        run: pip install pip-audit && pip-audit || true
      - name: Migrate + test
        run: alembic upgrade head && pytest -q
      - name: Eval regression gate (Phase 10)
        run: python -m eval.run --gate || true
