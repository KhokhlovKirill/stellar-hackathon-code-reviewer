<!doctype html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Aegis{% endblock %} · Aegis Security Review</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full text-slate-800">
  <nav class="bg-slate-900 text-slate-100">
    <div class="mx-auto max-w-6xl px-4 h-14 flex items-center justify-between">
      <a href="{% if user %}/dashboard{% else %}/review{% endif %}"
         class="font-semibold tracking-tight text-lg">
        🛡️ Aegis
      </a>
      <div class="flex items-center gap-4 text-sm">
        <a href="/review" class="hover:text-white text-slate-300">⚡ Quick Review</a>
        {% if user %}
        <a href="/chat" class="hover:text-white text-slate-300">🛡️ Agent</a>
        {% endif %}
        {% if user %}
        <a href="/dashboard" class="hover:text-white text-slate-300">Projects</a>
        <span class="text-slate-400">{{ user.email }}</span>
        <a href="/logout"
           class="rounded bg-slate-700 px-3 py-1 hover:bg-slate-600">Log out</a>
        {% else %}
        <a href="/login" class="hover:text-white text-slate-300">Sign in</a>
        <a href="/register"
           class="rounded bg-slate-700 px-3 py-1 hover:bg-slate-600">Register</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="mx-auto max-w-6xl px-4 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
