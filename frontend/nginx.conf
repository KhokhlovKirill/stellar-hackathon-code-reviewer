server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS: re-resolve `api` after container restarts (avoids stale IP → 502)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- Backend (must be before SPA fallback) ---
    location ^~ /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-running LLM scans take 1-3 minutes and stream whitespace
        # heartbeats to keep the connection alive. Buffering would swallow
        # those heartbeats and trip intermediate NAT idle timeouts.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
    }

    location ^~ /webhooks/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /docs {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /redoc {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ~ ^/(healthz|readyz|metrics)$ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # --- React SPA ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
